version: 2
updates:
  # Dart dependencies are upgraded by hand with `flutter pub upgrade --major-versions`.
  # The pub ecosystem resolver runs without a Flutter SDK, so it cannot see the
  # versions flutter and flutter_test pin, and the lockfile it writes is rejected by
  # `flutter pub get --enforce-lockfile`.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
