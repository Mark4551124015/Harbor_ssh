name: Normalize historical releases
on:
  push:
    branches: [main]
    paths: ['scripts/normalize_releases.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: normalize-historical-releases
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify canonical assets and remove superseded releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/normalize_releases.py --check
          python3 scripts/normalize_releases.py
