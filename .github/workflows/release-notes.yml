name: Sync release notes
on:
  push:
    branches: [main]
    paths: ['CHANGELOG.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-release-notes
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Update the existing release description
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/release.py notes > "$RUNNER_TEMP/release-notes.md"
          VERSION=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); from release import version; print(version()[0])")
          for TAG in "$VERSION" "v$VERSION" "beta-${VERSION%-beta}"; do
            if gh release view "$TAG" --json tagName > /dev/null 2>&1; then
              gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
              exit 0
            fi
          done
          echo "No published release for $VERSION yet; notes will be included during publication."
