name: Windows native
on:
  pull_request:
    paths: ['windows/**', 'assets/brand/harbor-mark.png', 'pubspec.yaml', '.github/workflows/windows.yml']
  push:
    branches: [main, windows-native]
    paths: ['windows/**', 'assets/brand/harbor-mark.png', 'pubspec.yaml', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Test configuration and OpenSSH lifecycle
        shell: pwsh
        run: ./windows/build.ps1 -Task Test
      - name: Build self-contained x64 preview
        shell: pwsh
        run: ./windows/build.ps1 -Task Publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Harbor-Windows-x64-preview
          path: windows/artifacts/win-x64/
          if-no-files-found: error
          retention-days: 14
