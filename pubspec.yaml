name: macos_ssh_tool
description: A high-performance SSH manager for macOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Core UI library for a native macOS feel
  macos_ui: ^2.0.0
  # State management
  provider: ^6.0.0
  # Path handling
  path_provider: ^2.1.6
  path: ^1.8.3
  # Icon font
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  assets:
    - LICENSE
    - assets/brand/harbor-mark.png
  uses-material-design: true